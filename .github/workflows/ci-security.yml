name: VaultForge CI - Build, Scan, Sign, Push

on:
  workflow_call:
    inputs:
      app_path:
        type: string
        default: ./app
      image_name:
        type: string
        default: vault-forge-app
      aws_region:
        type: string
        default: ap-south-1
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      ECR_REPOSITORY_URL:
        required: false
    outputs:
      image_digest:
        value: ${{ jobs.sign-and-push.outputs.image_digest }}
  push:
    branches: [main, 'scratch/**']
  pull_request:
    branches: [main, 'scratch/**']

concurrency:
  group: vaultforge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_PATH: ${{ inputs.app_path || './app' }}
  IMAGE_NAME: ${{ inputs.image_name || 'vault-forge-app' }}

jobs:
  # ---------------------------------------------------------------
  # Stage 1: Validate Dockerfile exists before doing anything else
  # ---------------------------------------------------------------
  validate-dockerfile:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile exists
        run: |
          if [ ! -f "${{ env.APP_PATH }}/Dockerfile" ]; then
            echo "::error::No Dockerfile found at ${{ env.APP_PATH }}/Dockerfile"
            echo "Run 'docker init' locally to generate a production-ready Dockerfile,"
            echo "review it, commit it, and re-run the pipeline."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Stage 2: Secrets scan — must pass before anything touches the image
  # ---------------------------------------------------------------
  secrets-scan:
    name: Gitleaks - Secrets Scan
    needs: validate-dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.gitleaks.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Handle failure
        if: steps.gitleaks.outcome == 'failure'
        uses: ./.github/actions/graceful-exit
        with:
          stage: "Gitleaks Secrets Scan"
          reason: "Exposed secrets were found. Remove the secret and rotate it if it was ever pushed."

  # ---------------------------------------------------------------
  # Stage 3: Dependency scan (OSV-Scanner) — runs parallel to SAST
  # ---------------------------------------------------------------
  dependency-scan:
    name: OSV-Scanner - Dependency Scan
    needs: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV-Scanner
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --output=osv-results.sarif
            --format=sarif
            -r
            ${{ env.APP_PATH }}
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # ---------------------------------------------------------------
  # Stage 4: SAST (Semgrep) — per-tool SARIF upload immediately after scan
  # ---------------------------------------------------------------
  sast-scan:
    name: Semgrep - SAST
    needs: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      critical_count: ${{ steps.count.outputs.critical }}
      finding_count: ${{ steps.count.outputs.findings }}
      result: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/owasp-top-ten --config=p/django --config=p/python \
            --sarif --output=semgrep.sarif \
            --json --output=semgrep.json \
            ${{ env.APP_PATH }}
      # FIX: SARIF uploaded here, right after the scan runs — not batched at
      # the end of the pipeline where a later gate failure could skip it.
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Count findings
        id: count
        if: always()
        run: |
          COUNT=$(jq '.results | length' semgrep.json 2>/dev/null || echo 0)
          CRIT=$(jq '[.results[]? | select(.extra.severity=="ERROR")] | length' semgrep.json 2>/dev/null || echo 0)
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30
      # Blocking gate — set repo variable ALLOW_CRITICAL_CVES=true to bypass for demo targets
      - name: Gate on critical findings
        id: gate
        if: ${{ vars.ALLOW_CRITICAL_CVES != 'true' }}
        run: |
          CRIT=${{ steps.count.outputs.critical }}
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT critical-severity Semgrep finding(s). Failing build."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Stage 5: Dockerfile lint — cheap, fast, fails before any build cost
  # ---------------------------------------------------------------
  dockerfile-lint:
    name: Hadolint - Dockerfile Best Practices
    needs: validate-dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        id: hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.APP_PATH }}/Dockerfile
          format: sarif
          output-file: hadolint.sarif
      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # ---------------------------------------------------------------
  # Stage 6: Kubernetes manifest validation — validates independently of the
  # image build, so it can run in parallel with the build/scan lane.
  # ---------------------------------------------------------------
  manifest-validation:
    name: kube-score - Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kube-score
        run: |
          curl -sL https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64 -o /usr/local/bin/kube-score
          chmod +x /usr/local/bin/kube-score
      - name: Build manifests with Kustomize
        run: kubectl kustomize kubernetes/overlays/dev > rendered.yaml
      - name: Run kube-score
        run: kube-score score rendered.yaml --output-format ci

  # ---------------------------------------------------------------
  # Stage 7: Build + SBOM (+ CI-mode Falco monitoring of the build itself)
  # ---------------------------------------------------------------
  build-and-sbom:
    name: Build Image + SBOM
    needs: [dependency-scan, sast-scan, dockerfile-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sbom_result: ${{ steps.sbom.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Falco (CI supply-chain monitoring)
        id: falco-start
        continue-on-error: true
        uses: falcosecurity/falco-actions/start@main
        with:
          mode: live
      - name: Build application image
        id: docker-build
        run: docker buildx build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} --load ${{ env.APP_PATH }}
      - name: Save image for downstream jobs
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM
        id: sbom
        run: syft ${{ env.IMAGE_NAME }}:${{ github.sha }} -o cyclonedx-json=sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 30
      - name: Stop Falco and report
        if: always()
        continue-on-error: true
        uses: falcosecurity/falco-actions/stop@main

  # ---------------------------------------------------------------
  # Stage 8: Image scan — SARIF uploaded immediately, gate applied after
  # ---------------------------------------------------------------
  image-scan:
    name: Trivy - Container Vulnerability Scan
    needs: build-and-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      critical_count: ${{ steps.count.outputs.critical }}
      high_count: ${{ steps.count.outputs.high }}
      result: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar
      - name: Run Trivy scan (SARIF + JSON)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Run Trivy scan (JSON, for gate + counts)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL,HIGH --format json --output trivy-report.json ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Count findings
        id: count
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json 2>/dev/null || echo 0)
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30
      # Security Policy Gate — the single blocking checkpoint before signing/push
      - name: Security Policy Gate
        id: gate
        if: ${{ vars.ALLOW_CRITICAL_CVES != 'true' }}
        run: |
          CRIT=${{ steps.count.outputs.critical }}
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT CRITICAL CVE(s) found. Blocking sign/push."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Stage 9: Sign + push — the ONLY job in this workflow that touches AWS,
  # authenticated via GitHub OIDC (no long-lived AWS keys in secrets).
  # FIX: replaces static AWS_ACCESS_KEY_ID/SECRET with short-lived
  # federated credentials scoped to this one role.
  # ---------------------------------------------------------------
  sign-and-push:
    name: Cosign Sign + Push to ECR
    needs: [image-scan, manifest-validation]
    if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && secrets.ECR_REPOSITORY_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image (by digest)
        id: push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ steps.push.outputs.digest }}

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}

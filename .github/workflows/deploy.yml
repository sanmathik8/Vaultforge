name: VaultForge Deploy - Infrastructure & ECS Fargate Deployment

on:
  workflow_call:
    inputs:
      image_digest:
        type: string
        required: false
      overlay:
        type: string
        default: dev
      aws_region:
        type: string
        default: ap-south-1
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
    outputs:
      rollout_result:
        description: "Outcome of the rollout step"
        value: ${{ jobs.deploy.outputs.rollout_result }}
      already_deployed:
        description: "True if target digest was already running in ECS"
        value: ${{ jobs.deploy.outputs.already_deployed }}
      alb_dns_name:
        description: "Discovered ALB DNS Name"
        value: ${{ jobs.deploy.outputs.alb_dns_name }}

concurrency:
  group: vaultforge-deploy-${{ inputs.overlay }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ---------------------------------------------------------------
  # Checkov IaC Scan & Terraform Configuration Validation
  # ---------------------------------------------------------------
  iac-validation:
    name: Checkov & Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/bootstrap
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Validate
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------
  # ECS Fargate Deployment & Rollout Checkpoint (Tag-Based AWS Discovery)
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ECS Fargate
    needs: iac-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for OIDC
      security-events: write
    outputs:
      rollout_result: ${{ steps.rollout.outcome || 'skipped' }}
      already_deployed: ${{ steps.ecs-checkpoint.outputs.already_deployed }}
      alb_dns_name: ${{ steps.discover-infra.outputs.alb_dns }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials & image digest
        id: check-preconditions
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          DIGEST: ${{ inputs.image_digest }}
        run: |
          if [ -z "$AWS_ROLE" ] || [ -z "$DIGEST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.check-preconditions.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Tag-Based AWS Infrastructure Discovery
        id: discover-infra
        if: steps.check-preconditions.outputs.configured == 'true'
        run: |
          # 1. Discover ECS Cluster tagged with Project=VaultForge
          CLUSTER_ARN=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge \
            --resource-type-filters ecs:cluster \
            --query 'ResourceTagMappingList[0].ResourceARN' --output text 2>/dev/null || echo "")

          if [ -n "$CLUSTER_ARN" ] && [ "$CLUSTER_ARN" != "None" ]; then
            CLUSTER_NAME=$(echo "$CLUSTER_ARN" | awk -F'/' '{print $2}')
          else
            CLUSTER_NAME="vault-forge"
          fi

          # 2. Discover ALB DNS Name tagged with Project=VaultForge
          ALB_ARN=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge \
            --resource-type-filters elasticloadbalancing:loadbalancer \
            --query 'ResourceTagMappingList[0].ResourceARN' --output text 2>/dev/null || echo "")

          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
          else
            ALB_DNS=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
          fi

          # 3. Discover ECS Service Name tagged with Project=VaultForge
          SERVICE_ARN=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge \
            --resource-type-filters ecs:service \
            --query 'ResourceTagMappingList[0].ResourceARN' --output text 2>/dev/null || echo "")

          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            SERVICE_NAME=$(echo "$SERVICE_ARN" | awk -F'/' '{print $3}')
          else
            SERVICE_NAME=$(aws ecs list-services --cluster "$CLUSTER_NAME" --query 'serviceArns[0]' --output text 2>/dev/null | awk -F'/' '{print $3}' || echo "vault-forge-app")
          fi

          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

          echo "### 🔍 Tag-Based AWS Infrastructure Discovered" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Cluster**: \`${CLUSTER_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Service**: \`${SERVICE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ALB Endpoint**: \`${ALB_DNS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Filter**: \`Project=VaultForge\` via AWS Resource Groups Tagging API" >> $GITHUB_STEP_SUMMARY

      - name: Install Cosign
        if: steps.check-preconditions.outputs.configured == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Cosign verify (pre-deploy sanity check)
        if: steps.check-preconditions.outputs.configured == 'true'
        run: cosign verify ${{ inputs.image_digest }} --certificate-identity-regexp ".*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Check ECS Service Active Image Checkpoint
        id: ecs-checkpoint
        if: steps.check-preconditions.outputs.configured == 'true'
        run: |
          CLUSTER="${{ steps.discover-infra.outputs.cluster_name }}"
          SERVICE="${{ steps.discover-infra.outputs.service_name }}"
          ACTIVE_TASK_DEF=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo "")
          
          if [ -n "$ACTIVE_TASK_DEF" ] && [ "$ACTIVE_TASK_DEF" != "None" ]; then
            ACTIVE_IMAGE=$(aws ecs describe-task-definition --task-definition "$ACTIVE_TASK_DEF" --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || echo "")
          else
            ACTIVE_IMAGE=""
          fi

          if [ "$ACTIVE_IMAGE" = "${{ inputs.image_digest }}" ]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "### ⏩ ECS Deployment Checkpoint Hit" >> $GITHUB_STEP_SUMMARY
            echo "ECS Service \`${SERVICE}\` is already running target image digest \`${{ inputs.image_digest }}\`. Skipping duplicate rollout." >> $GITHUB_STEP_SUMMARY
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render Task Definition with signed image digest
        if: steps.check-preconditions.outputs.configured == 'true' && steps.ecs-checkpoint.outputs.already_deployed != 'true'
        id: render-taskdef
        run: |
          sed 's|"vault-forge-app:placeholder"|"${{ inputs.image_digest }}"|g' ecs/task-definition.json > rendered-taskdef.json
          echo "Task definition rendered successfully"

      - name: Register ECS Task Definition
        if: steps.check-preconditions.outputs.configured == 'true' && steps.ecs-checkpoint.outputs.already_deployed != 'true'
        id: register-taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://rendered-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS Service (Rolling Deployment)
        if: steps.check-preconditions.outputs.configured == 'true' && steps.ecs-checkpoint.outputs.already_deployed != 'true'
        id: rollout
        continue-on-error: true
        run: |
          CLUSTER="${{ steps.discover-infra.outputs.cluster_name }}"
          SERVICE="${{ steps.discover-infra.outputs.service_name }}"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition ${{ steps.register-taskdef.outputs.task_def_arn }} --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Application health check via ALB
        if: steps.check-preconditions.outputs.configured == 'true'
        run: |
          CLUSTER="${{ steps.discover-infra.outputs.cluster_name }}"
          SERVICE="${{ steps.discover-infra.outputs.service_name }}"
          echo "Verifying ECS service status..."
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE"

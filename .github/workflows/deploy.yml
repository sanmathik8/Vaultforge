name: VaultForge Deploy - Infrastructure & ECS Fargate Deployment

on:
  workflow_call:
    inputs:
      image_digest:
        type: string
        required: false
      overlay:
        type: string
        default: dev
      aws_region:
        type: string
        default: ap-south-1
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      ECS_CLUSTER_NAME:
        required: false
    outputs:
      rollout_result:
        description: "Outcome of the rollout step"
        value: ${{ jobs.deploy.outputs.rollout_result }}

concurrency:
  group: vaultforge-deploy-${{ inputs.overlay }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ---------------------------------------------------------------
  # Checkov IaC Scan & Terraform Configuration Validation
  # ---------------------------------------------------------------
  iac-validation:
    name: Checkov & Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/bootstrap
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Validate
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------
  # ECS Fargate Deployment & Rollout Monitoring
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ECS Fargate
    needs: iac-validation
    if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && inputs.image_digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for OIDC
      security-events: write
    outputs:
      rollout_result: ${{ steps.rollout.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign verify (pre-deploy sanity check)
        run: cosign verify ${{ inputs.image_digest }} --certificate-identity-regexp ".*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Render Task Definition with signed image digest
        id: render-taskdef
        run: |
          sed 's|"vault-forge-app:placeholder"|"${{ inputs.image_digest }}"|g' ecs/task-definition.json > rendered-taskdef.json
          echo "Task definition rendered successfully"

      - name: Register ECS Task Definition
        id: register-taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://rendered-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS Service (Rolling Deployment)
        id: rollout
        continue-on-error: true
        run: |
          CLUSTER=${{ secrets.ECS_CLUSTER_NAME || 'vault-forge' }}
          aws ecs update-service --cluster $CLUSTER --service vault-forge-app --task-definition ${{ steps.register-taskdef.outputs.task_def_arn }} --force-new-deployment
          aws ecs wait services-stable --cluster $CLUSTER --services vault-forge-app

      - name: Application health check via ALB
        run: |
          CLUSTER=${{ secrets.ECS_CLUSTER_NAME || 'vault-forge' }}
          echo "Verifying ECS service status..."
          aws ecs describe-services --cluster $CLUSTER --services vault-forge-app

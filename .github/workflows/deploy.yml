name: VaultForge Deploy - Infrastructure & Kubernetes Deployment

on:
  workflow_call:
    inputs:
      image_digest:
        type: string
        required: false
      overlay:
        type: string
        default: dev
      aws_region:
        type: string
        default: ap-south-1
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      EKS_CLUSTER_NAME:
        required: false
    outputs:
      rollout_result: ${{ jobs.deploy.outputs.rollout_result }}

concurrency:
  group: vaultforge-deploy-${{ inputs.overlay }}
  cancel-in-progress: false   # never cancel a deploy mid-rollout

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ---------------------------------------------------------------
  # Checkov IaC Scan & Terraform Configuration Validation
  # ---------------------------------------------------------------
  iac-validation:
    name: Checkov & Terraform Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/bootstrap
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Validate
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------
  # Kustomize Deployment, Kyverno Admission, Rollout & Rollback
  # ---------------------------------------------------------------
  deploy:
    name: Deploy (${{ inputs.overlay }})
    needs: iac-validation
    if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && secrets.EKS_CLUSTER_NAME != '' && inputs.image_digest != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      rollout_result: ${{ steps.rollout.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ inputs.aws_region }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign verify (pre-deploy sanity check)
        run: cosign verify ${{ inputs.image_digest }} --certificate-identity-regexp ".*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Set image digest in kustomization
        run: |
          cd kubernetes/overlays/${{ inputs.overlay }}
          kustomize edit set image vault-forge-app=${{ inputs.image_digest }}

      - name: Deploy via Kustomize
        run: kubectl apply -k kubernetes/overlays/${{ inputs.overlay }}

      - name: Confirm Kyverno admission accepted the workload
        run: kubectl get events -n vault-forge --field-selector reason=PolicyViolation --sort-by='.lastTimestamp' | tail -20 || true

      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: kubectl rollout status deployment/vault-forge-app -n vault-forge --timeout=180s

      - name: Rollback on failure
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "::error::Rollout failed — rolling back automatically"
          kubectl rollout undo deployment/vault-forge-app -n vault-forge
          exit 1

      - name: Application health check
        run: |
          kubectl wait --for=condition=available --timeout=60s deployment/vault-forge-app -n vault-forge
          SVC_IP=$(kubectl get svc vault-forge-app -n vault-forge -o jsonpath='{.spec.clusterIP}')
          kubectl run curl-check --rm -i --restart=Never --image=curlimages/curl -- curl -sf http://$SVC_IP:8000/health

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-forge-app
  namespace: vault-forge
  labels:
    app: vault-forge-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault-forge-app
  template:
    metadata:
      labels:
        app: vault-forge-app
    spec:
      serviceAccountName: vault-forge-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault-forge-app
          image: vault-forge-app:placeholder   # replaced by `kustomize edit set image` in cd-deploy.yml
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5

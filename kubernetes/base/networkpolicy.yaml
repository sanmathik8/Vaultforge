apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-forge-app
  namespace: vault-forge
spec:
  podSelector:
    matchLabels:
      app: vault-forge-app
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
    # Allow in-cluster pods / ZAP runner to reach service
    - from:
        - podSelector: {}
      ports:
        - port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443

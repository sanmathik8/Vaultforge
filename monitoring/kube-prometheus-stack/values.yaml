# Helm values for prometheus-community/kube-prometheus-stack
# Confirms scrape auto-discovery (ServiceMonitor/PodMonitor) and — the
# review's automation-gap finding — wires an actual Alertmanager receiver
# so alerts don't just get generated, they get delivered somewhere.

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 400Mi }
      limits: { cpu: 500m, memory: 1Gi }

alertmanager:
  config:
    route:
      receiver: "webhook-default"
      group_by: ["alertname", "namespace"]
      routes:
        - match:
            severity: critical
          receiver: "webhook-critical"
    receivers:
      - name: "webhook-default"
        webhook_configs:
          - url: "${ALERTMANAGER_WEBHOOK_URL}"   # set via Helm --set-string at deploy time
      - name: "webhook-critical"
        webhook_configs:
          - url: "${ALERTMANAGER_WEBHOOK_URL}"
            send_resolved: true

grafana:
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"   # set via Helm --set-string, never committed
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: vault-forge
          folder: VaultForge
          type: file
          options:
            path: /var/lib/grafana/dashboards/vault-forge
  dashboardsConfigMaps:
    vault-forge: vault-forge-dashboards

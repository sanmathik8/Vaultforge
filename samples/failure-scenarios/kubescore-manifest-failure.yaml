# Sample failure asset for kube-score Manifest Validator
# Demonstrates missing securityContext, missing resource limits, and latest image tag

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-score-failing-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failing-app
  template:
    metadata:
      labels:
        app: failing-app
    spec:
      containers:
        - name: failing-container
          image: nginx:latest   # CRITICAL: latest image tag
          # Missing resources limits/requests
          # Missing securityContext (runs as root, privileged)

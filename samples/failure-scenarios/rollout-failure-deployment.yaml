# Sample failure asset for Kubernetes Rollout Failure & Automatic Rollback
# Demonstrates deployment with invalid image tag causing ImagePullBackOff

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-forge-bad-rollout
  namespace: vault-forge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault-forge-app
  template:
    metadata:
      labels:
        app: vault-forge-app
    spec:
      containers:
        - name: vault-forge-app
          image: vault-forge-app:non-existent-tag-12345
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2

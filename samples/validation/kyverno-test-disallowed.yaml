# Disallowed Pod Manifest — Intentionally fails Kyverno policies
# Expect rejection by:
#  1. require-non-root (runAsUser: 0 / runAsNonRoot: false)
#  2. block-privileged-containers (privileged: true)
#  3. require-resource-limits (missing resources limits/requests)
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-disallowed-pod
  namespace: vault-forge
spec:
  containers:
    - name: rogue-container
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
